services:
  - type: web
    name: smartbusopt
    runtime: node
    plan: free
    buildCommand: >
      apt-get update -qq &&
      apt-get install -y -q software-properties-common &&
      add-apt-repository -y ppa:sumo/stable &&
      apt-get update -qq &&
      apt-get install -y -q sumo sumo-tools sumo-doc python3 python3-pip &&
      pip3 install sumolib traci --break-system-packages 2>/dev/null || pip3 install sumolib traci &&
      npm install &&
      mkdir -p server/data &&
      SUMO_HOME=/usr/share/sumo PYTHONPATH=/usr/share/sumo/tools python3 simulation/scripts/sim_build.py prepare &&
      SUMO_HOME=/usr/share/sumo PYTHONPATH=/usr/share/sumo/tools python3 simulation/scripts/sim_build.py geojson &&
      SUMO_HOME=/usr/share/sumo PYTHONPATH=/usr/share/sumo/tools python3 simulation/scripts/sim_build.py scenario sequence-003-observation-01 &&
      SUMO_HOME=/usr/share/sumo PYTHONPATH=/usr/share/sumo/tools python3 simulation/scripts/sim_build.py scenario sequence-005-observation-01 &&
      SUMO_HOME=/usr/share/sumo PYTHONPATH=/usr/share/sumo/tools python3 simulation/scripts/sim_build.py scenario sequence-006-observation-01 &&
      SUMO_HOME=/usr/share/sumo PYTHONPATH=/usr/share/sumo/tools python3 simulation/scripts/sim_build.py scenario sequence-009-observation-01
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 10000
      - key: SUMO_HOME
        value: /usr/share/sumo
      - key: SUMO_PYTHON
        value: /usr/bin/python3
      - key: SMARTBUSOPT_XLSX
        value: /opt/render/project/src/data/bus_data.xlsx
    healthCheckPath: /api/health
