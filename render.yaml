# SmartBusOpt — Render deployment
#
# Architecture on Render:
#
#   Render (Docker container)
#     │
#     ├── Node.js API  →  serves /public/* (map UI) + /api/* (REST + SSE)
#     │                   detects SUMO via `which sumo` → REAL_SUMO mode
#     │
#     └── SUMO Engine  →  spawned per-simulation by the TraCI Python bridge
#           ├── bengaluru.net.xml   (OSM-derived road network, committed)
#           ├── demand.rou.xml      (synthetic randomTrips demand, committed)
#           └── scenario configs    (pre-built at Docker build time)
#                       │
#                       ↓  TraCI SSE stream
#               Live vehicle positions + metrics → Map Visualization

services:
  - type: web
    name: smartbusopt
    runtime: docker        # Use Dockerfile for full SUMO + Node.js control
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SUMO_HOME
        value: /usr/share/sumo
      - key: SUMO_PYTHON
        value: /usr/bin/python3
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true
